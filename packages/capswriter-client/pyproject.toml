[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capswriter-client"
version = "3.0.0"
description = "CapsWriter-Offline 客户端：离线语音输入 + 灵动岛 UI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nurdich" }]
keywords = ["speech-recognition", "dictation", "offline", "capswriter"]
dependencies = [
    "rich",
    "typer",
    "colorama",
    "markdown",
    "keyboard",
    "pynput",
    "pyclip",
    "sounddevice",
    "watchdog",
    "websockets",
    "openai",
    "ollama",
    "httpx",
    "numpy",
    "numba",
    "pypinyin",
    "srt",
    "rapidfuzz",
    "pystray",
    "Pillow",
    "tkhtmlview",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/Nurdich/CapsWriter-Offline"
Repository = "https://github.com/Nurdich/CapsWriter-Offline"
Changelog = "https://github.com/Nurdich/CapsWriter-Offline/blob/island/CHANGELOG.md"

[project.scripts]
capswriter-client = "capswriter_client.cli:main"
capswriter-client-init = "capswriter_client.cli:init_workspace"

[tool.hatch.build.targets.wheel]
packages = ["capswriter_client"]

[tool.hatch.build.targets.wheel.force-include]
"../../core" = "core"
"../../config_client.py" = "config_client.py"
"../../hot.txt" = "hot.txt"
"../../hot-rule.txt" = "hot-rule.txt"
"../../hot-server.txt" = "hot-server.txt"
"../../assets" = "assets"
