[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capswriter-server"
version = "3.0.0"
description = "CapsWriter-Offline 服务端：本地离线语音识别引擎"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nurdich" }]
keywords = ["speech-recognition", "asr", "offline", "capswriter"]
dependencies = [
    "sherpa-onnx",
    "numpy",
    "gguf",
    "onnxruntime-directml",
    "rich",
    "websockets",
    "watchdog",
    "pypinyin",
    "pystray",
    "Pillow",
    "markdown",
    "tkhtmlview",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Homepage = "https://github.com/Nurdich/CapsWriter-Offline"
Repository = "https://github.com/Nurdich/CapsWriter-Offline"
Changelog = "https://github.com/Nurdich/CapsWriter-Offline/blob/island/CHANGELOG.md"

[project.scripts]
capswriter-server = "capswriter_server.cli:main"
capswriter-server-init = "capswriter_server.cli:init_workspace"

[tool.hatch.build.targets.wheel]
packages = ["capswriter_server"]

[tool.hatch.build.targets.wheel.force-include]
"../../core" = "core"
"../../config_server.py" = "config_server.py"
"../../hot-server.txt" = "hot-server.txt"
"../../assets" = "assets"
